<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tenis Trinidad</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#eef0f3;--card:#fff;--ink:#14171c;--mute:#5b626d;--line:#d9dde3;--accent:#12a150;--accentink:#fff;--tag:#ff5a1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--card:#1a1d23;--ink:#f2f4f7;--mute:#a0a7b3;--line:#2b3039;--accent:#2ecc71;--accentink:#08150d;--tag:#ff7a45;color-scheme:dark}}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 14px 90px}
h1{font-size:clamp(34px,10vw,56px);line-height:.95;font-weight:800;letter-spacing:-.03em;margin:8px 0}
.sub{color:var(--mute);margin:0 0 18px;font-size:15px}
.btn{display:block;text-align:center;text-decoration:none;border:0;cursor:pointer;font-family:inherit;background:var(--accent);color:var(--accentink);font-weight:800;font-size:15px;padding:12px 8px;border-radius:10px}
.btn:focus-visible,.chip:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 15px/1 inherit;font-family:inherit;padding:11px 16px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:1/1;background:var(--line)}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.size{position:absolute;left:8px;top:8px;background:var(--ink);color:var(--bg);font-weight:800;font-size:13px;padding:5px 9px;border-radius:8px}
.info{padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}.name{font-size:14px;font-weight:700;line-height:1.2}
.price{font-size:20px;font-weight:800;color:var(--tag)}.price.ask{font-size:14px;color:var(--mute);font-weight:500}.info .btn{margin-top:auto}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:30px 0}
.float{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:14px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
</style></head><body><div class="wrap">
<h1 id="t"></h1><p class="sub">Toca el botón del modelo que te guste y escríbenos por WhatsApp.</p>
<div class="filters" id="filters" role="group" aria-label="Filtrar por talla"></div><div class="grid" id="grid"></div></div>
<a class="btn float" id="fab" href="#">Escribir por WhatsApp</a>
<script src="productos.js"></script>
<script>
function wa(x){return "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(x)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
document.getElementById("t").textContent=NEGOCIO;document.title=NEGOCIO;
var sel="Todas",sizes=["Todas"].concat(Array.from(new Set(PRODUCTOS.map(function(d){return d.talla}))).sort(function(a,b){return a-b}));
var f=document.getElementById("filters"),g=document.getElementById("grid");
function chips(){f.innerHTML="";sizes.forEach(function(s){var b=document.createElement("button");b.className="chip";b.textContent=s==="Todas"?"Todas las tallas":"Talla "+s;b.setAttribute("aria-pressed",String(s===sel));b.onclick=function(){sel=s;chips();draw()};f.appendChild(b)})}
function draw(){g.innerHTML="";var l=PRODUCTOS.filter(function(d){return sel==="Todas"||String(d.talla)===String(sel)});
if(!l.length){g.innerHTML='<p class="empty">No hay modelos en esa talla por ahora.</p>';return}
l.forEach(function(d){var c=document.createElement("div");c.className="card";
var pr=d.precio?'<div class="price">'+esc(d.precio)+' Bs</div>':'<div class="price ask">Precio por WhatsApp</div>';
c.innerHTML='<div class="ph"><img src="'+esc(d.foto)+'" alt="'+esc(d.nombre)+'"><span class="size">Talla '+esc(d.talla)+'</span></div><div class="info"><div class="name">'+esc(d.nombre)+'</div>'+pr+'<a class="btn" target="_blank" rel="noopener" href="'+wa("Hola, me interesa el tenis "+d.nombre+", talla "+d.talla)+'">Lo quiero</a></div>';g.appendChild(c)})}
document.getElementById("fab").href=wa("Hola, vi el catálogo de "+NEGOCIO+" y quiero consultar");
chips();draw();
</script></body></html>
